# Clearance-aware procedural platforming generator + curriculum knobs.

default_count = 10
seed = 0
default_pack_group = "platforming_gen_v1"
# Retries per level when finalize rejects an oversized / unplaceable sketch.
pack_level_max_attempts = 8
# When false, packs use a single hard free-mix phase (no named curriculum).
use_curriculum = false

# Structure selection weights (reweighted at runtime; clearance conflicts → 0).
# Pit weight sits near continue so optional patterns (neighbor pits, delay
# ledges) get room to fire instead of drowning under plain pits.
continue_weight = 2.8
pit_weight = 2.2
floor_height_shift_weight = 2.2
turn_weight = 0.0
# Climb → reverse → extend the other way (creates switchbacks).
switchback_weight = 0.0

# Prefer continuing in the current heading vs turning (turns also require
# the current floor to sit higher than the previous one).
forward_bias = 1.2
# Horizontal travel direction bias in [-1, 1]: +1 = always left-to-right,
# -1 = always right-to-left, 0 = equal odds. P(left-to-right) = (1 + bias) / 2.
ltr_direction_bias = 0.0
# After a successful climb, chance to immediately reverse direction.
post_climb_turn_odds = 0.0
# Multiplier applied to turn_weight while standing above the previous floor.
post_climb_turn_boost = 3.0

# Floor / platform sizing
min_platform_width = 4
max_platform_width = 6
min_continue_length = 4
max_continue_length = 6
spawn_platform_width = 4
spawn_platform_thickness = 1

# Path length (number of structure steps after spawn)
min_path_steps = 6
max_path_steps = 10

# Vertical / gap authoring
# Deepest allowed downward surface delta in tiles (negative delta_h floor).
max_fall_height = 6
# Minimum |delta| when sampling a non-zero height change (pits / shifts).
min_delta_magnitude = 0
# Easy-end gap budget; hard phases may use physics max for the chosen delta.
easy_max_gap_tiles = 5
# Pits must span at least this many empty tiles (horizontal depth).
min_gap_tiles = 5
# Pit depth (tiles below the higher floor edge) sampled per pit in this range.
# A row of spike traps lines the pit floor at the sampled depth.
pit_min_depth_tiles = 1
pit_max_depth_tiles = 5
# How many tiles of each platform edge are included in a pit span.
span_edge_overlap_tiles = 2
# Transition gap wideness range (tiles) for height-shifted floors (falls and climbs).
min_shift_transition_gap_tiles = 1
max_shift_transition_gap_tiles = 3

# Enforced empty clearance above floors.
# Heights are in Delver-height multiples; absolute tiles = ceil(DH * multiplier).
# Min (= DH) is common but not exclusive — continuity keeps adjacent segments close.
min_floor_clearance_delver_heights = 1.0
max_floor_clearance_delver_heights = 4.0
# Max |Δheight| in tiles between successive floor corridors.
clearance_height_max_step = 2
clearance_height_stay_weight = 3.0
clearance_height_change_weight = 1.0
# Chance the spawn corridor starts taller than the minimum.
clearance_height_start_raise_odds = 0.25
# Across pits / climbs: jump-arc clearance above the *takeoff* floor (JH + DH).
# Landing platforms keep ambient floor clearance; only climb lips are raised.
span_clearance_jump_heights = 1.0
span_clearance_delver_heights = 1.0

# Optional patterns (odds in [0, 1]). Neighbor pits are planned as a pair
# before the first gap (bridge width = solid tiles between the two gaps).
# Delay ledges are a short floor-height bump: climb a height sampled between
# ``delay_ledge_min_height_tiles`` and ~¾ JH for ``delay_ledge_width`` tiles,
# then drop back. A clear runway of radius
# (same-height max gap − delay_ledge_width) / 2 is enforced on each side so the
# bump sits in the middle of a max-gap-wide approach window.
neighbor_pit_bridge_odds = 0.35
neighbor_pit_bridge_width = 2
delay_ledge_odds = 0.35
delay_ledge_width = 2
delay_ledge_min_height_tiles = 1
delay_ledge_jump_height_fraction = 0.75
# Spike trap decoration. Pit floors always carry a full spike strip (extremity
# corner cells included — they point up like the rest of the row), and pit
# internal walls stay clean. Spikes never clash on internal corners: two
# 4-adjacent spikes always share one orientation, so a corner never shows
# spikes on both adjoining surfaces.
# Hanging ceiling strips appear in "galleries": stretches of walking corridor
# whose ceiling is raised (never inside jump envelopes), with the strip length
# sampled per gallery in this range so spikes appear grouped.
spike_group_min_tiles = 2
spike_group_max_tiles = 6
# Gallery ceilings sit this many rows above the corridor's ambient ceiling, so
# hanging spikes stay above the Delver's head and outside any required jump.
ceiling_gallery_raise_tiles = 2
# Per eligible corridor run, chance to carve one gallery holding a spike strip.
ceiling_spike_trap_odds = 0.6
# Per gallery end wall (raised rows above head height), chance of a wall spike.
wall_spike_trap_odds = 1.0

# Finalize padding around the painted path before sealing walls.
finalize_pad_tiles = 2
# Extra empty rows reserved above the highest floor for clearance.
top_margin_tiles = 1

# Curriculum: named obstacle-type phases (only when use_curriculum = true).
levels_per_phase = 2

[[phases]]
name = "flat_run"
allow_pits = false
allow_floor_height_shifts = false
max_gap_tiles = 0
max_rise_tiles = 0
max_fall_tiles = 0
min_path_steps = 3
max_path_steps = 6
continue_weight = 10.0
pit_weight = 0.0
floor_height_shift_weight = 0.0

[[phases]]
name = "same_height_pits"
allow_pits = true
allow_floor_height_shifts = false
max_gap_tiles = 8
max_rise_tiles = 0
max_fall_tiles = 0
force_delta_h = 0
min_path_steps = 4
max_path_steps = 8
continue_weight = 3.0
pit_weight = 4.0
floor_height_shift_weight = 0.0

[[phases]]
name = "rises"
allow_pits = true
allow_floor_height_shifts = true
max_gap_tiles = 5
# Positive deltas only (climbs); 0 means use jump height from physics.
max_rise_tiles = 0
max_fall_tiles = 0
prefer_positive_delta = true
min_path_steps = 5
max_path_steps = 10
continue_weight = 2.5
pit_weight = 2.0
floor_height_shift_weight = 3.0

[[phases]]
name = "falls"
allow_pits = true
allow_floor_height_shifts = true
max_gap_tiles = 6
max_rise_tiles = 0
# 0 means use max_fall_height from this file.
max_fall_tiles = 0
prefer_negative_delta = true
min_path_steps = 5
max_path_steps = 10
continue_weight = 2.5
pit_weight = 2.0
floor_height_shift_weight = 3.0

[[phases]]
name = "mixed"
allow_pits = true
allow_floor_height_shifts = true
max_gap_tiles = 0
max_rise_tiles = 0
max_fall_tiles = 0
min_path_steps = 6
max_path_steps = 14
continue_weight = 3.0
pit_weight = 2.5
floor_height_shift_weight = 2.0
