tilemap_layer_names = ["platforms", "traps"]
window_width = 1280
window_height = 720
window_title = "AI Delver"
fps = 60
min_canvas_zoom = 2
max_canvas_zoom = 5
initial_canvas_zoom = 2
min_brush_size = 1
max_brush_size = 9
initial_brush_size = 1

[camera]
start_zoom = 3.0
min_zoom = 1.0
max_zoom = 7.0
scroll_speed = 1.0
zoom_speed = 0.3

[style.font]
# Folder under assets/fonts/ (preferred), or a system family if that folder is missing.
family = "FiraCode Nerd Font"
# Stretch glyph height (1.0 = original).
vertical_scale = 1.0
# Letter spacing: 1.0 = original, <1 tighter (e.g. 0.88–0.94).
tracking = 0.90
small_size = 12
standard_size = 14
subtitle_size = 18

[style]
# Default Color theme stem (assets/themes/<name>.json). User choice is persisted in data/ui_prefs.json.
theme = "dungeon"
section_spacing = 48

# Global editor chrome (session header above page content).
[style.navbar]
height = 42
pad_x = 12
pad_y = 6
brand = "Ai Delver"
favicon_size = 22
favicon_gap = 8
brand_gap = 28
tab_font_size = 14
tab_height = 30
# Horizontal padding (spaces) inside each page tab label.
tab_pad_chars = 3
title_max_chars = 40
status_connected_color = "#6BBF6B"
status_disconnected_color = "#a8261b"
status_loading_color = "#C9A227"
status_muted_color = "#8A8F98"
status_training_color = "#E8A05A"

[review]
focus_episodes_between_passes = 16000
review_episodes_per_level = 100
review_levels_per_arm = 5
tune_focus_episodes_between_passes = 1500

# Path Visualizer (trajectory minimap) reveal / wipe animation.
# Durations are wall-clock targets; tick work scales with grid/path size.
[path_visualizer]
tick_ms = 24
tile_reveal_ms = 400
tile_wipe_ms = 320
path_reveal_ms = 450
grow_frames = 10
debounce_ms = 80

# Trajectory run-picker grid (primary selector; slider stays secondary).
[run_grid]
cell_size = 14
cell_gap = 2
row_height = 16
visible_rows = 6
overscan_rows = 2
max_height = 120
legend_hash_chars = 12
legend_width = 180
side_by_side_min_width = 520
scrub_width = 160
legend_name_max_chars = 18
legend_name_hover_ms = 1200
path_popup_width = 720
path_popup_height = 560
tooltip_delay_ms = 80
live_pulse_ms = 450
play_border_color = "#fbbf24"
selection_color = "#ffffff"
live_color = "#00ffff"

[level_archive]
hash_display_chars = 12
window_width = 960
window_height = 640

# Standalone level browser / playtest secondary app (playtest-gui CLI).
[playtest_gui]
window_width = 1040
window_height = 720
title = "Level Playtest"
# "Regen pack" button: wipe + regenerate this generated group.
regen_pack_group = "platforming_gen_v1"
regen_pack_count = 30
regen_pack_button_label = "Regen pack (30)"

# Per-entity DragonBones editor representation export settings.
# New skeletal entities need a [dragonbones.<name>] block.
[dragonbones.delver]
representation_animation = "idle"
representation_frame = 0

# Hazard death explosion (visual only): detached skeleton parts flung by a
# client-side pymunk simulation in viewing mode. Gravity matches the world.
[death_explosion]
# Outward velocity scale applied to each part (px/s).
speed = 280.0
# Extra upward kick so parts burst off the floor (px/s).
upward_bias = 160.0
# Parts spin with a random angular velocity up to this (rad/s).
max_spin = 6.0
# Mass per px² of part area.
part_density = 0.001
part_friction = 0.6
part_restitution = 0.45
# Static floor/wall material for the parts to bounce and slide on.
# Tile restitution is 1.0 so the part's own restitution governs the bounce
# (pymunk combines restitution multiplicatively).
tile_friction = 1.2
tile_restitution = 1.0
# Velocity retention per second (pymunk space damping; lower = more drag).
# Keeps the pile near the death spot instead of skittering off level edges.
air_damping = 0.5
# Parts below this depth under y=0 are removed.
despawn_depth = 64.0
# Per-frame physics dt clamp (tab-focus spikes must not explode the sim).
max_dt = 0.05
# Death animation played once at the death spot (path relative to assets/).
gif_path = "img/sprites/delver/delver_death.gif"
gif_scale = 1.0

# Debris display overrides: slot name -> subtexture name from delver_tex.json.
# Slots not listed keep the frame playing at death time.
[death_explosion.part_displays]
head = "head13"
torso = "torso9"

# Delver sprite animation shown next to the training log (and GIF export knobs).
[delver_gif]
target_height = 140
animations = ["idle", "run"]
scale = 4.0
antialias = true

[shortcuts]
level_editor = "<Alt-Key-1>"
agent = "<Alt-Key-2>"
